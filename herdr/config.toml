[keys]
prefix = "ctrl+a"
split_vertical = ["prefix+|", "prefix+\\"]
split_horizontal = "prefix+-"

previous_workspace = "prefix+up"
next_workspace = "prefix+down"
switch_workspace = "prefix+shift+1..9"

last_pane = "prefix+a"

# Navigate the attention queue
previous_agent = "prefix+ctrl+p"
next_agent = "prefix+ctrl+n"
focus_agent = "prefix+ctrl+1..9"

# Complements the default prefix+shift+g new-worktree binding.
open_worktree = "prefix+ctrl+g"
remove_worktree = "prefix+alt+g"

[[keys.command]]
key = "prefix+ctrl+j"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "open Sesh picker"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "fullerzz.sesh.last"
description = "switch to previous workspace"

[[keys.command]]
key = "prefix+ctrl+m"
type = "plugin_action"
command = "nicosuave.memex.palette"
description = "memex session palette"

[terminal]
new_cwd = "follow"

[ui]
mouse_capture = true

prompt_new_tab_name = false
prompt_new_workspace_name = false

pane_outer_borders = true
pane_gaps = false
pane_scrollbars = false
show_agent_labels_on_pane_borders = false

hide_tab_bar_when_single_tab = true
window_title = "{workspace}: {terminal_title}"

status_indicators = "symbols"
agent_panel_sort = "priority"

[ui.sidebar.agents]
rows = [
    ["state_icon", "state_text", "workspace"],
    ["agent", "terminal_title_stripped"],
]

[ui.sound]
enabled = false

[ui.toast]
delivery = "terminal"

[theme]
name = "nord"
